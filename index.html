<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>La heladería</title>
        <link rel="icon" href="./favicon.ico" />
    </head>
    <body>
        <div id="root"></div>

        <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>
        <script type="text/babel" data-type="module">
            import React from "https://esm.sh/react@19.2.0?dev";
            import { createRoot } from "https://esm.sh/react-dom@19.2.0/client?dev";

            // Encabezado de la página web
            const heading = <h1>La Heladería</h1>;

            // Sabores de helado
            const itemName = <h2>Mora silvestre</h2>;
            const itemName2 = <h2>Pictacho</h2>;

            // Descripciones de cada sabor de helado
            const itemDescription = React.createElement(
                "p",
                { className: "menu-item-description" },
                "Mora de Ambato con un toque de limón.",
            );

            const itemDescription2 = React.createElement(
                "p",
                { className: "menu-item-description" },
                "Sabor suave con trozos de nuez.",
            );

            // Items para cada sabor de helado
            const menuItem = React.createElement(
                "article",
                { className: "menu-item" },
                itemName,
                itemDescription,
            );

            const menuItem2 = React.createElement(
                "article",
                { className: "menu-item" },
                itemName2,
                itemDescription2,
            );

            // Menu con los diferentes sabores de helado
            const menu = (
                <main>
                    {heading}
                    {menuItem}
                    {menuItem2}
                </main>
            );

            // Creación del shadowroot y renderizado de su contenido en el DOM
            const root = createRoot(document.getElementById("root"));
            root.render(<>{menu}</>);
        </script>
    </body>
</html>
