<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>La heladería</title>
        <link rel="icon" href="./favicon.ico" />
    </head>
    <body>
        <div id="root"></div>

        <!--inclusión de React y Babel en el proyecto desde CDN-->
        <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>
        <script type="text/babel" data-type="module">
            import React from "https://esm.sh/react@19.2.0?dev";
            import { createRoot } from "https://esm.sh/react-dom@19.2.0/client?dev";

            // Objetos en JS que contiene información sobre el item y su sabor de helado
            const menuItemInf1 = {
                id: 1,
                iceCream: {
                    id: 3,
                    name: "Mora silvestre",
                    imagePath: "images/mora.svg",
                },
                description: "Mora de Ambato con un toque de limón.",
                price: 12,
                inStock: false,
            };
            const menuItemInf2 = {
                id: 2,
                iceCream: {
                    id: 4,
                    name: "Pistacho",
                    imagePath: "images/pistacho.svg",
                },
                description: "Sabor suave con trozos de nuez.",
                price: 1,
                inStock: true,
            };

            // Expresión lambda que adapta el formato del precio del helado
            const formatPrice = (price) =>
                new Intl.NumberFormat("es-EC", {
                    style: "currency",
                    currency: "USD",
                }).format(price);

            // Encabezado de la página web
            const heading = <h1>La Heladería</h1>;

            // Items visuales para cada sabor de helado
            const menuItem = (
                <article
                    className="menu-item"
                    aria-labelledby={`menu-item-${menuItemInf1.id}-name`}
                >
                    <img
                        src={menuItemInf1.iceCream.imagePath}
                        alt=""
                        className="photo"
                    />

                    <h2 id={`menu-item-${menuItemInf1.id}-name`}>
                        {menuItemInf1.iceCream.name}
                    </h2>

                    <p className="menu-item-description">
                        {menuItemInf1.description}
                    </p>

                    {/*llamada a la expresion lambda*/}
                    <p className="menu-item-price">
                        {formatPrice(menuItemInf1.price)}
                    </p>

                    {/* uso de operador ternario para reflejar la disponibilidad actual del helado*/}
                    <p className="menu-item-stock">
                        {menuItemInf1.inStock ? " Disponible hoy" : "Agotado"}
                    </p>

                    <label htmlFor="description">Descripción </label>
                    <input
                        id="description"
                        maxLength="120"
                        readOnly
                        className="field"
                    />
                </article>
            );
            const menuItem2 = (
                <article
                    className="menu-item"
                    aria-labelledby={`menu-item-${menuItemInf2.id}-name`}
                >
                    <img
                        src={menuItemInf2.iceCream.imagePath}
                        alt=""
                        className="photo"
                    />

                    <h2 id={`menu-item-${menuItemInf2.id}-name`}>
                        {menuItemInf2.iceCream.name}
                    </h2>

                    <p className="menu-item-description">
                        {menuItemInf2.description}
                    </p>

                    <p className="menu-item-price">
                        {formatPrice(menuItemInf2.price)}
                    </p>

                    <p className="menu-item-stock">
                        {menuItemInf2.inStock ? " Disponible hoy" : "Agotado"}
                    </p>

                    <label htmlFor="description">Descripción </label>
                    <input
                        id="description"
                        maxLength="120"
                        readOnly
                        className="field"
                    />
                </article>
            );

            // Pie de página para el menú
            const footer = (
                <footer>
                    <p>La Heladería -- Ambato</p>
                </footer>
            );

            // Menu con los diferentes sabores de helado
            const menu = (
                <main>
                    {heading}
                    {menuItem}
                    {menuItem2}
                </main>
            );

            // Creación del shadowroot y renderizado de su contenido en el DOM
            const root = createRoot(document.getElementById("root"));
            root.render(
                <>
                    {menu}
                    {footer}
                </>,
            );
        </script>
    </body>
</html>
