<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>La heladería</title>
        <link rel="icon" href="./favicon.ico" />
    </head>
    <body>
        <div id="root"></div>

        <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>
        <script type="text/babel" data-type="module">
            import React from "https://esm.sh/react@19.2.0?dev";
            import { createRoot } from "https://esm.sh/react-dom@19.2.0/client?dev";

            // Encabezado de la página web
            const heading = <h1>La Heladería</h1>;

            // Sabores de helado
            const itemName = <h2 id="flavor-1">Mora silvestre</h2>;
            const itemName2 = <h2>Pistacho</h2>;

            // Descripciones de cada sabor de helado
            const itemDescription = (
                <p className="menu-item-description">
                    Mora de Ambato con un toque de limón.
                </p>
            );

            const itemDescription2 = (
                <p className="menu-item-description">
                    Sabor suave con trozos de nuez.
                </p>
            );

            // Items para cada sabor de helado
            const menuItem = (
                <article className="menu-item" aria-labelledby="flavor-mora">
                    {itemName}
                    <img src="mora.svg" alt="Helado de mora silvestre" className="photo"/>
                    {itemDescription}
                    <label htmlFor="description">Descripción </label>
                    <input id="description" maxLength="120" readOnly className="field"/>
                </article>
            );

            const menuItem2 = (
                <article className="menu-item">
                    {itemName2}
                    <img src="pistacho.svg" alt="Helado de pistacho" className="photo"/>
                    {itemDescription2}
                    <label htmlFor="description">Descripción </label>
                    <input id="description" maxLength="120" readOnly className="field"/>
                </article>
            );

            // Pie de página para el menú
            const footer = <footer><p>La Heladería -- Ambato</p></footer>;

            // Menu con los diferentes sabores de helado
            const menu = (
                <main>
                    {heading}
                    {menuItem}
                    {menuItem2}
                </main>
            );

            // Creación del shadowroot y renderizado de su contenido en el DOM
            const root = createRoot(document.getElementById("root"));
            root.render(<>{menu}{footer}</>);
        </script>
    </body>
</html>
